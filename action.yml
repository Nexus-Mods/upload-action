name: Upload to Nexus Mods
description: Uploads a file to Nexus Mods
branding:
  icon: upload-cloud
  color: orange
inputs:
  api_key:
    description: API key
    required: true
  file_id:
    description: File ID on Nexus Mods (the file to add a new version to)
    required: true
  filename:
    description: Name of the zip file to upload
    required: true
  description:
    description: Description for the uploaded file version used on Nexus Mods
  version:
    description: Version string for the uploaded file version (e.g., 1.0.0)
    required: true
  category:
    description: Category for the uploaded file version
    required: false
    default: main
  display_name:
    description: The display name for the uploaded file version, defaults to the file name
    required: false
  archive_existing_version:
    description: Archive the existing version when uploading a new version
    required: false
    default: 'false'
  primary_mod_manager_download:
    description: Whether this file is the default download for mod managers
    required: false
  allow_mod_manager_download:
    description: Whether mod manager downloads are enabled for this file
    required: false
  show_requirements_pop_up:
    description: Whether to show a requirements popup when downloading this file
    required: false
  update_mod_version:
    description: Whether to update the mod's version to match this file's version
    required: false
    default: 'false'
outputs:
  version_id:
    description: The ID of the uploaded file version on Nexus Mods
runs:
  using: node24
  main: dist/index.js
